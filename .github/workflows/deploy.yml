name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Check required Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN in GitHub repo settings."
            exit 1
          fi
          
          if [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "No CLOUDFLARE_ACCOUNT_ID secret found. Resolving account id from token..."
          account_payload=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts")
          account_id=$(printf '%s' "$account_payload" | node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(0,'utf8')); if (!data.success || !Array.isArray(data.result) || data.result.length===0) {process.exit(1)} console.log(data.result[0].id);")
          if [ -z "$account_id" ]; then
            echo "Could not resolve account id from token. Check token permissions and account access."
            exit 1
          fi
          if [[ ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "Invalid account id resolved from token: $account_id"
            exit 1
          fi
          echo "Resolved CLOUDFLARE_ACCOUNT_ID=$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "Cloudflare credentials resolved."
      - name: Deploy to Cloudflare Workers via OpenNext
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
