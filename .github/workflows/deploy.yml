name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Validate application
        run: npm run lint && npm run typecheck
      - name: Check required Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN//$'\r'/}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN//$'\n'/}"

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN in GitHub repo settings."
            exit 1
          fi

          echo "Cloudflare token is present. Wrangler will use account_id from wrangler.jsonc."
      - name: Build OpenNext bundle
        run: npx opennextjs-cloudflare build
      - name: Deploy Cloudflare Worker
        # Wrangler uploads the Worker without OpenNext's optional KV bulk prefill.
        # Runtime requests populate the persistent KV cache after deployment.
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPEN_NEXT_DEPLOY: "true"
