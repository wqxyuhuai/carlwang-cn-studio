name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Check required Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN//$'\r'/}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN//$'\n'/}"

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN in GitHub repo settings."
            exit 1
          fi

          token_length=${#CLOUDFLARE_API_TOKEN}
          echo "CLOUDFLARE_API_TOKEN length: $token_length"

          if [ "$token_length" -lt 30 ]; then
            echo "::error::CLOUDFLARE_API_TOKEN looks too short. If your secret is a token name (not the full token string), Cloudflare will reject it."
            exit 1
          fi

          echo "Cloudflare token is present. Wrangler will use account_id from wrangler.jsonc."
      - name: Deploy to Cloudflare Workers via OpenNext
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
